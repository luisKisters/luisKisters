<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luis Kisters · Contribution dashboard</title>
<style>
  :root {
    --bg:#0d1117; --card:#161b22; --border:#30363d; --title:#f0f6fc; --text:#c9d1d9;
    --muted:#8b949e; --accent:#2f81f7; --green:#39d353; --track:#21262d;
    --green-soft:rgba(46,160,67,.15); --hover:rgba(177,186,196,.08);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#ffffff; --card:#ffffff; --border:#d0d7de; --title:#1f2328; --text:#1f2328;
      --muted:#656d76; --accent:#0969da; --green:#1a7f37; --track:#d8dee4;
      --green-soft:rgba(31,136,61,.12); --hover:rgba(31,35,40,.05);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:36px 20px 64px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
  h1 { margin:0 0 6px; font-size:26px; color:var(--title); }
  h2 { margin:0 0 4px; font-size:16px; color:var(--title); }
  .sub { margin:0; color:var(--muted); font-size:14px; }
  .pill { flex-shrink:0; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600; color:var(--green); background:var(--green-soft); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 24px; margin-bottom:20px; scroll-margin-top:24px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; }
  .stat b { display:block; font-size:22px; color:var(--title); }
  .stat span { font-size:12px; color:var(--muted); }
  .chart-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .toggle { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .toggle button { border:0; background:none; color:var(--muted); font:inherit; font-size:12px; padding:6px 14px; cursor:pointer; }
  .toggle button.on { background:var(--accent); color:#fff; }
  #chart { position:relative; }
  #chart svg { display:block; width:100%; height:auto; }
  .tip { position:fixed; z-index:10; pointer-events:none; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--text); box-shadow:0 8px 24px rgba(0,0,0,.35); max-width:280px; }
  .tip b { color:var(--title); }
  .hint { margin:10px 0 0; font-size:12px; color:var(--muted); }
  .detail { margin-top:14px; border-top:1px solid var(--border); padding-top:14px; }
  .detail h3 { margin:0 0 8px; font-size:13px; color:var(--title); }
  .detail ul { margin:0; padding:0; list-style:none; }
  .detail li { padding:5px 0; font-size:13px; border-bottom:1px dashed var(--border); display:flex; gap:10px; justify-content:space-between; }
  .detail li:last-child { border-bottom:0; }
  .detail .when { color:var(--muted); white-space:nowrap; font-size:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width: 760px) { .grid { grid-template-columns:1fr; } }
  .rows { list-style:none; margin:10px 0 0; padding:0; }
  .rows li { margin:0; }
  .rows a { display:grid; grid-template-columns:24px 1fr auto; gap:6px 12px; align-items:center; padding:9px 10px; border-radius:8px; color:var(--text); }
  .rows a:hover { background:var(--hover); text-decoration:none; }
  .rows .rank { color:var(--muted); font-size:12px; }
  .rows .name { font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .rows .val { font-size:13px; color:var(--title); font-weight:600; white-space:nowrap; }
  .rows .barline { grid-column:2 / span 2; display:flex; align-items:center; gap:12px; }
  .rows .bar-track { flex:1; height:4px; border-radius:2px; background:var(--track); position:relative; overflow:hidden; }
  .rows .bar { position:absolute; left:0; top:0; height:100%; border-radius:2px; background:var(--accent); }
  .rows .meta { color:var(--muted); font-size:12px; white-space:nowrap; }
  .tag { font-size:10px; font-weight:600; color:var(--green); background:var(--green-soft); border-radius:999px; padding:2px 8px; flex-shrink:0; }
  .feed { list-style:none; margin:12px 0 0; padding:0; max-height:420px; overflow:auto; }
  .feed li { display:flex; gap:14px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; align-items:baseline; }
  .feed li:last-child { border-bottom:0; }
  .feed .when { color:var(--muted); font-size:12px; white-space:nowrap; width:88px; flex-shrink:0; }
  .feed .repo { color:var(--accent); font-weight:600; white-space:nowrap; }
  .feed .kind { color:var(--green); font-size:11px; font-weight:600; width:52px; flex-shrink:0; text-transform:uppercase; letter-spacing:.4px; }
  select { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; font:inherit; font-size:12px; padding:6px 10px; }
  footer { margin-top:28px; color:var(--muted); font-size:12px; text-align:center; }
  .axis { font-size:10px; fill:var(--muted); }
  .gline { stroke:var(--track); }
  .mline { stroke:var(--border); stroke-opacity:.4; }
  .zero { fill:var(--track); }
  .avg { fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; }
</style>
</head>
<body>
<main>
  <header class="head">
    <div>
      <h1>Contribution dashboard</h1>
      <p class="sub">Luis Kisters · github.com/luisKisters · last 12 months</p>
    </div>
    <span class="pill" id="pill"></span>
  </header>

  <section class="stats" id="stats"></section>

  <section class="card" id="chart-card">
    <div class="chart-head">
      <h2>Activity</h2>
      <div class="toggle" id="toggle">
        <button data-view="weekly" class="on">Weekly</button>
        <button data-view="daily">Daily</button>
      </div>
    </div>
    <div id="chart"></div>
    <p class="hint" id="chart-hint"></p>
    <div id="detail" class="detail" hidden></div>
  </section>

  <section class="grid">
    <div class="card" id="focus">
      <h2>Current focus</h2>
      <p class="sub">Pushes over the last 30 days</p>
      <ul class="rows" id="focus-rows"></ul>
    </div>
    <div class="card" id="built">
      <h2>Most built</h2>
      <p class="sub">Own commits · original repos · default branches</p>
      <ul class="rows" id="built-rows"></ul>
    </div>
  </section>

  <section class="card" id="activity">
    <div class="chart-head">
      <h2>Recent activity</h2>
      <select id="filter"><option value="">All repos</option></select>
    </div>
    <ul class="feed" id="feed"></ul>
  </section>

  <footer>Auto-refreshes daily · generated <span id="gen"></span></footer>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("en-US");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const KIND_LABEL = { push:"push", pr:"pr", issue:"issue", review:"review", release:"rel", repo:"repo" };
const EVENTS_BY_DAY = {};
DATA.events.forEach((e) => {
  const d = e.date.slice(0, 10);
  (EVENTS_BY_DAY[d] = EVENTS_BY_DAY[d] || []).push(e);
});

$("pill").textContent = DATA.scope === "public + private" ? "includes private contributions" : "public contributions only";
$("gen").textContent = DATA.generated_at;

$("stats").innerHTML = [
  [fmt(DATA.totals.total), "contributions"],
  [String(DATA.totals.daily_average), "daily average"],
  [DATA.totals.longest_streak + " days", "longest streak"],
  [String(DATA.totals.best_day.count), "best day · " + prettyDate(DATA.totals.best_day.date)]
].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

function prettyDate(iso) {
  const d = new Date(iso + "T00:00:00Z");
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
function shortDate(iso) {
  const d = new Date(iso + "T00:00:00Z");
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

const CHART_W = 1000, CHART_H = 260, PAD_L = 44, PAD_R = 12, PAD_T = 16, PAD_B = 42;
const PLOT_W = CHART_W - PAD_L - PAD_R, PLOT_H = CHART_H - PAD_T - PAD_B;
let view = "weekly";
let selection = null;

function niceScale(max) {
  const step = [10, 20, 25, 50, 100, 200, 500, 1000].find((s) => max / s <= 4) || 1000;
  return { step, top: Math.max(step, Math.ceil(max / step) * step) };
}
function monthLabelPos(rows) {
  const seen = {};
  const out = {};
  rows.forEach((r, i) => {
    const m = (r.start || r.date).slice(0, 7);
    if (!(m in seen)) seen[m] = i;
  });
  return seen;
}

const tip = document.createElement("div");
tip.className = "tip";
tip.hidden = true;
document.body.appendChild(tip);

function renderChart() {
  const rows = view === "weekly" ? DATA.weekly : DATA.daily;
  const values = rows.map((r) => r.total != null ? r.total : r.count);
  const max = Math.max(...values, 1);
  const { step, top } = niceScale(max);
  const slot = PLOT_W / rows.length;
  const bw = view === "weekly" ? Math.min(16, slot * 0.62) : Math.max(1.5, slot * 0.55);
  const y = (v) => PAD_T + PLOT_H - (v / top) * PLOT_H;
  const cx = (i) => PAD_L + i * slot + slot / 2;

  let svg = `<svg viewBox="0 0 ${CHART_W} ${CHART_H}" role="img" aria-label="contribution chart">`;
  svg += `<defs><linearGradient id="bfill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--green)" stop-opacity="0.95"/>
    <stop offset="1" stop-color="var(--green)" stop-opacity="0.3"/></linearGradient></defs>`;
  for (let t = 0; t <= top; t += step) {
    svg += `<line x1="${PAD_L}" y1="${y(t)}" x2="${CHART_W - PAD_R}" y2="${y(t)}" class="gline"/>`;
    svg += `<text x="${PAD_L - 8}" y="${y(t) + 3.5}" text-anchor="end" class="axis">${t}</text>`;
  }
  const mp = monthLabelPos(rows);
  let totals = {};
  DATA.monthly.forEach((m) => totals[m.month] = m.total);
  Object.entries(mp).forEach(([month, i]) => {
    const x = cx(i);
    svg += `<line x1="${x}" y1="${PAD_T}" x2="${x}" y2="${PAD_T + PLOT_H}" class="mline"/>`;
    svg += `<text x="${x}" y="${CHART_H - 22}" text-anchor="middle" class="axis" style="font-size:11px">${MONTHS[+month.slice(5, 7) - 1]}</text>`;
    svg += `<text x="${x}" y="${CHART_H - 7}" text-anchor="middle" class="axis">${totals[month]}</text>`;
  });

  let ma = [];
  rows.forEach((r, i) => {
    const lo = Math.max(0, i - (view === "weekly" ? 1 : 3));
    const hi = Math.min(rows.length, i + (view === "weekly" ? 3 : 4));
    const win = values.slice(lo, hi);
    ma.push(`${cx(i)},${y(win.reduce((a, b) => a + b, 0) / win.length)}`);
  });

  rows.forEach((r, i) => {
    const v = r.total != null ? r.total : r.count;
    const x = cx(i) - bw / 2;
    if (v > 0) {
      const ty = y(v), h = PAD_T + PLOT_H - ty, r2 = Math.min(3.5, bw / 2, h);
      svg += `<path d="M${x},${PAD_T + PLOT_H} L${x},${ty + r2} Q${x},${ty} ${x + r2},${ty} L${x + bw - r2},${ty} Q${x + bw},${ty} ${x + bw},${ty + r2} L${x + bw},${PAD_T + PLOT_H} Z" fill="url(#bfill)" data-i="${i}" class="hit"/>`;
    } else {
      svg += `<rect x="${x}" y="${PAD_T + PLOT_H - 2.5}" width="${bw}" height="2.5" rx="1" class="zero" data-i="${i}"/>`;
    }
  });
  svg += `<path d="M ${ma.join(" L ")}" class="avg" pointer-events="none"/>`;
  svg += `<line x1="${PAD_L}" y1="${PAD_T + PLOT_H}" x2="${CHART_W - PAD_R}" y2="${PAD_T + PLOT_H}" class="gline"/>`;
  svg += "</svg>";
  $("chart").innerHTML = svg;

  const svgEl = $("chart").querySelector("svg");
  svgEl.addEventListener("mousemove", (ev) => {
    const el = ev.target.closest("[data-i]");
    if (!el) { tip.hidden = true; return; }
    const i = +el.dataset.i;
    const r = rows[i];
    const v = r.total != null ? r.total : r.count;
    let label;
    if (view === "weekly") {
      const weekDays = DATA.daily.filter((d) => d.date >= r.start && d.date <= r.end);
      const best = weekDays.reduce((a, b) => (b.count > (a ? a.count : -1) ? b : a), null);
      label = `<b>${shortDate(r.start)} – ${shortDate(r.end)}</b><br>${fmt(v)} contributions` + (best && best.count ? `<br>best day ${shortDate(best.date)} · ${best.count}` : "");
    } else {
      label = `<b>${prettyDate(r.date)}</b><br>${fmt(v)} contribution${v === 1 ? "" : "s"}`;
    }
    tip.innerHTML = label;
    tip.hidden = false;
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 300) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  svgEl.addEventListener("mouseleave", () => { tip.hidden = true; });
  svgEl.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-i]");
    if (!el) return;
    selection = +el.dataset.i;
    showDetail(rows[selection]);
  });

  $("chart-hint").textContent = view === "weekly"
    ? "Hover a bar for the week's numbers · click to drill into its days."
    : "Hover a bar for the day's count · click to see what happened.";
  if (selection != null && selection < rows.length) showDetail(rows[selection]); else $("detail").hidden = true;
}

function showDetail(row) {
  const start = row.start || row.date;
  const end = row.end || row.date;
  const v = row.total != null ? row.total : row.count;
  const inRange = DATA.daily.filter((d) => d.date >= start && d.date <= end);
  const dayLines = inRange
    .filter((d) => d.count > 0)
    .map((d) => {
      const evs = EVENTS_BY_DAY[d.date] || [];
      return `<li><span>${shortDate(d.date)} — <b>${d.count}</b> contribution${d.count === 1 ? "" : "s"}${evs.length ? " · " + evs.length + " event" + (evs.length > 1 ? "s" : "") : ""}</span></li>`;
    }).join("");
  const evs = DATA.events.filter((e) => e.date.slice(0, 10) >= start && e.date.slice(0, 10) <= end);
  const evLines = evs.map((e) =>
    `<li><span><span class="kind">${KIND_LABEL[e.kind] || e.kind}</span> ${esc(e.text)} — <a href="${e.url}" target="_blank" rel="noopener">${esc(e.repo)}</a></span><span class="when">${e.date.slice(11, 16)}</span></li>`
  ).join("");
  $("detail").innerHTML =
    `<h3>${view === "weekly" ? shortDate(start) + " – " + shortDate(end) : prettyDate(start)} · ${fmt(v)} contribution${v === 1 ? "" : "s"}</h3>` +
    (evLines ? `<ul>${evLines}</ul>` : `<ul>${dayLines || "<li><span>No recorded contributions in this window.</span></li>"}</ul>`);
  $("detail").hidden = false;
}

$("toggle").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  view = btn.dataset.view;
  selection = null;
  $("toggle").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === btn));
  renderChart();
});

function repoRows(container, rows, valueLabel) {
  const max = Math.max(...rows.map((r) => r.value), 1);
  $(container).innerHTML = rows.map((r, i) => {
    const pct = Math.max(3, Math.round(100 * r.value / max));
    return `<li><a href="${r.url}" target="_blank" rel="noopener">
      <span class="rank">${String(i + 1).padStart(2, "0")}</span>
      <span class="name">${esc(r.name)}${r.private ? '<span class="tag">private</span>' : ""}</span>
      <span class="val">${r.value} ${valueLabel}</span>
      <span class="barline"><span class="bar-track"><span class="bar" style="width:${pct}%"></span></span><span class="meta">${esc(r.detail)}</span></span>
    </a></li>`;
  }).join("");
}
repoRows("focus-rows", DATA.focus, "pushes");
repoRows("built-rows", DATA.built, "commits");

const feed = $("feed");
const byRepo = {};
DATA.events.forEach((e) => byRepo[e.repo] = (byRepo[e.repo] || 0) + 1);
const repoNames = Object.keys(byRepo).sort((a, b) => byRepo[b] - byRepo[a]);
$("filter").innerHTML = '<option value="">All repos</option>' + repoNames.map((r) => `<option value="${esc(r)}">${esc(r)} (${byRepo[r]})</option>`).join("");

function renderFeed() {
  const f = $("filter").value;
  const rows = DATA.events.filter((e) => !f || e.repo === f).slice(0, 300);
  feed.innerHTML = rows.length ? rows.map((e) =>
    `<li><span class="when">${shortDate(e.date.slice(0, 10))}</span><span class="kind">${KIND_LABEL[e.kind] || e.kind}</span><span style="flex:1">${esc(e.text)}</span><a class="repo" href="${e.url}" target="_blank" rel="noopener">${esc(e.repo)}</a></li>`
  ).join("") : '<li><span style="color:var(--muted)">No events match.</span></li>';
}
$("filter").addEventListener("change", renderFeed);
renderFeed();
renderChart();
</script>
</body>
</html>
